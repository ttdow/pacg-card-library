<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="pacg-data-mode" content="static">
  <meta name="description" content="Search the original Pathfinder Adventure Card Game card library.">
  <title>PACG · Card library</title>
  <script src="./theme.js?v=135dc273b1fd"></script>
  <link rel="icon" href="./favicon.svg?v=8658463b272b" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css?v=ab46b602a22d">
  <link rel="stylesheet" href="./card-face.css?v=c5c5c5e1f0ff">
  <script src="./library-data.js?v=737257c2c051" defer></script>
  <script src="./card-face.js?v=59d978cd110b" defer></script>
  <script src="./app.js?v=ea0f38d6eb49" defer></script>
</head>
<body>
  <a class="skip-link" href="#detail">Skip to card details</a>
  <header class="topbar">
    <a class="brand" href="./" aria-label="PACG home"><img src="./favicon.svg?v=8658463b272b" width="34" height="34" alt=""><span>PACG</span></a>
    <div class="header-actions"><button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light mode">Light mode</button></div>
  </header>
  <main class="workspace">
    <section class="library-heading" aria-labelledby="page-title">
      <h1 id="page-title">Pathfinder Adventure Card Game</h1>
    </section>
    <form id="filters" class="filters" role="search">
      <div class="search-row">
        <div class="search-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg><label class="sr-only" for="search">Search cards</label><input id="search" name="q" type="search" maxlength="200" placeholder="Search names, traits, or card text…" autocomplete="off"><kbd aria-hidden="true">/</kbd></div>
      </div>
      <details id="search-options" class="search-options">
        <summary id="filter-summary">Search options</summary>
        <div class="filter-row">
        <label><span>Search scope</span><select id="mode" name="mode"><option value="text">Names &amp; card text</option><option value="name">Card names only</option></select></label>
        <label><span>Card type</span><select id="type" name="type"><option value="">All card types</option></select></label>
        <label><span>Adventure path</span><select id="family" name="family"><option value="">All adventure paths</option></select></label>
        <label class="deck-filter"><span>Deck or collection</span><select id="product" name="product"><option value="">All decks &amp; collections</option></select></label>
        <label><span>Text coverage</span><select id="status" name="status"><option value="">All records</option><option value="review">Needs review</option><option value="incomplete">Partial or missing text</option></select></label>
        <button id="clear" class="reset-button" type="button">Reset filters</button>
        </div>
      </details>
    </form>
    <div class="browser-layout">
      <section class="results-panel" aria-label="Search results">
        <div class="results-heading"><h2 id="result-count" aria-live="polite">Loading cards</h2><span id="result-order">A–Z</span></div>
        <div id="results" class="results" aria-busy="true"></div>
        <nav class="pagination" aria-label="Results pages"><button id="previous" type="button" aria-label="Previous page">←</button><span id="page-label">Page 1</span><button id="next" type="button" aria-label="Next page">→</button></nav>
      </section>
      <article id="detail" class="detail-panel" tabindex="-1" aria-label="Card details" aria-busy="true"><div class="empty-detail"><img class="empty-die" src="./favicon.svg?v=8658463b272b" alt=""><h2>Your next discovery awaits</h2><p>Select a card to see its rules and deck contents.</p></div></article>
    </div>
    <section id="record" class="record-panel" aria-label="Library record" hidden></section>
  </main>
  <div id="announcement" class="sr-only" role="status"></div>
  <noscript>This card browser needs JavaScript for search and card details.</noscript>
</body>
</html>
